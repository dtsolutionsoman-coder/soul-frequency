      - generic [ref=f3e63]:
        - paragraph [ref=f3e64]: Hidden within a private garden in the heart of Dharamshala, Shabnam Oberoii's bespoke sound healing studio is a sanctuary dedicated to deep restoration and conscious wellbeing. Trained in Rishikesh, Shabnam offers personalized sound healing experiences for individuals and small groups in an environment designed exclusively for immersive sonic therapy.
        - paragraph [ref=f3e65]: Every session is tailored to the physical, emotional, and energetic needs of each client. Drawing on the frequencies of gongs, crystal bowls, Tibetan singing bowls, shamanic drums, and other therapeutic instruments, she crafts unique soundscapes that invite profound relaxation, nervous system regulation, and inner harmony.
        - paragraph [ref=f3e66]: The studio itself has been purpose-built with specialized soundproofing and acoustic design, creating an exceptional listening environment where every vibration can be experienced with remarkable depth and clarity. Combining professional expertise, intentional design, and a deeply personal approach, the studio offers a unique space for healing, reflection, and transformation.
