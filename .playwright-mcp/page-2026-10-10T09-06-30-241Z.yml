    - generic [ref=f11e41]:
      - heading "About Shabnam Oberoii" [level=1] [ref=f11e42]
      - generic [ref=f11e45]:
        - paragraph [ref=f11e46]: My journey into sound healing began as a personal path of transformation. Through the power of sound and vibration, I experienced greater stillness, balance, and inner clarity, inspiring me to explore this healing modality more deeply and eventually share it with others. To further my understanding, I trained in sound healing in Rishikesh, where I studied the principles of vibrational healing and holistic wellbeing.
        - paragraph [ref=f11e47]: I offer personalised sound healing sessions from my private, purpose-built studio nestled in the back garden of my home in Dharamshala. Designed with specialised soundproofing and acoustic treatment, the studio creates an immersive environment where the subtle frequencies of sound can be experienced in their full depth. Surrounded by a beautiful garden and a tranquil pond that attracts birds and butterflies, the space offers a peaceful sanctuary where nature and sound come together to support relaxation and healing.
        - paragraph [ref=f11e48]: Each session is thoughtfully curated according to the unique needs of the individual or group. Using gongs, Tibetan and crystal singing bowls, shamanic drums, chimes, and other therapeutic instruments, I create sound journeys that help calm the nervous system, release tension, restore balance, and encourage deep rest and renewal.
        - paragraph [ref=f11e49]: My intention is to provide a nurturing space where people can pause, reconnect with themselves, and experience the restorative power of sound in a setting designed for wellbeing, reflection, and transformation.
