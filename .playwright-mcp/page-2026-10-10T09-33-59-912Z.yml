        - paragraph [ref=f17e94]: You make decisions that ripple through other people’s lives. Sound healing is the opposite of that pressure — a practice of receiving.
        - paragraph [ref=f17e95]: In a purpose-built acoustic room, therapeutic frequencies guide the nervous system out of vigilance and into a parasympathetic state — the physiology of deep rest, where clarity repairs itself. Nothing is asked of you here. No technique to learn, no effort to make. You lie down; the sound does the work.
      - paragraph [ref=f17e96]: नाद ब्रह्म · Nāda Brahma — the universe is sound
      - generic [ref=f17e97]:
        - article [ref=f17e98]:
          - heading "Regulation" [level=3] [ref=f17e99]
          - paragraph [ref=f17e100]: The nervous system downshifts. Cortisol recedes, breath lengthens, and the body remembers a baseline it had forgotten beneath the noise.
        - article [ref=f17e101]:
          - heading "Release" [level=3] [ref=f17e102]
          - paragraph [ref=f17e103]: Vibration reaches what conversation cannot. Repetitive thought patterns loosen; what has been carried, finally settles.
        - article [ref=f17e104]:
          - heading "Resonance" [level=3] [ref=f17e105]
          - paragraph [ref=f17e106]: Guests describe it as coming home — a return to signal beneath the static. Sleep deepens. Attention sharpens. Decisions simplify.
